        function searchFlight(desination) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log(`searching flight to destination ${desination}`);
                    resolve(`flight to destination ${desination}found `);
                }, 1000);
            })
        }
        function bookFlight(details) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {

                    resolve(`collect your ticket for ${details}`);
                }, 3000);
            })

        }
        function checkIn(ticketDetails) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {

                    resolve(` ready to board..HAPPY AND SAFE JOURNEY... ${ticketDetails}`);
                }, 3000);
            })

        }
        //using promising
        searchFlight("dubai..")
        .then(details=>bookFlight(details))//book flight after searching.
        .then(ticketDetails=checkIn(ticketDetails))//checkin after booking..
