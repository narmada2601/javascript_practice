//creating my own example
let makeCoffee=new Promise((resolve,reject)=>
{
    let coffeeready=true;//false then it prints reject message...
    setTimeout(()=>{
        if(coffeeready)
    {
        resolve("coffee is ready☕ ")
    }
    else{
        reject("failed to make a coffee")
    }
    },4000);
});
//usage of promise
makeCoffee.then((message)=>{
                       console.log(message);//coffee is ready
                    }
).catch((error)=>{
    console.error(error);
});
