//using property .....we need use get and set methods
class Employee {
    constructor(name, age, location, hobbies) {
        this.name = name;
        this.age = age;
        this.location = location;
        this.hobbies = hobbies; // Array of hobbies
    }

    getDetails() {
        return `Name: ${this.name}, Age: ${this.age}, Location: ${this.location}, Hobbies: ${this.hobbies.join(", ")}`;
    }
}

console.log(emp.getDetails());
