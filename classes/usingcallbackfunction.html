        //same program using callback function
 

class calculator{
            constructor()
            {
                this.result=0;
            }
             operation(a,b,callback)//method
             {
                  this.result=callback(a,b);
                   return `result: ${this.result}`;
             }
     }
 function add(a,b) {
    return a+b;
}
 
function subtract(a,b) {
    return a-b;
}
 
function multiply(a,b) {
    return a*b;
}
function divide(a,b)
                {
                    if (b==0)
                {
                    return "error: division of zero is not allowed";
                }
                else{
                    this.result=a/b;
                    return `division of two numbers are ${this.result}`;
                }
                }

        let calc =new calculator();
        console.log(calc.operation(10,5,add));
         console.log(calc.operation(10,5,subtract));
          console.log(calc.operation(10,5,multiply));
           console.log(calc.operation(10,5,divide));
            console.log(calc.operation(10,0,divide));
