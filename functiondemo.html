        console.log(`Hello, ${name}!`);
       }
               sayHello();           // Output: Hello, friend!

                //callback functions: function passed as an argument to another function,
                //  and it's executed after the outer function finishes its task.
                //  This is especially useful for handling asynchronous operations like API calls, timers, or event listeners.

function calculate(a, b, callback) {
  return callback(a, b);
}

function add(x, y) {
  return x + y;
}

function multiply(x, y) {
  return x * y;
}

console.log(calculate(5, 3, add));      
console.log(calculate(5, 3, multiply)); 

//anomonous function function without names
let show = function() {
    console.log('Anonymous function');
};
//passing anomonous function as anotherfunction
setTimeout(function() {
    console.log('Execute later after 1 second');
}, 1000);

show();
//simple example
let fullName = {
    firstName: 'Narmada',
    lastName: 'Teegala'
};
// create a function and execute it immediately after the declaration,IIFE
(function () {
    console.log(fullName.firstName + ' ' + fullName.lastName);
})(fullName);
