<!DOCTYPE html>
<html>

<head>
    <title>my own coffee machine application,,.....</title>
    <style>
        body {
            background-color: rgb(235, 195, 209);
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        #coffee-message {
            font-size: 20px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            background-color: rgb(84, 129, 149);
            color: white;
            border: none;
            border-radius: 5px;


        }
    </style>



</head>

<body>

    <h1>Welcome to the Coffee Machine ☕</h1>
    <label for="sugar" >Sugar Level</label>
    <select id="sugar">
        <option value="none">None</option>
        <option value="less">Less</option>
        <option value="medium">Medium</option>
        <option value="more">More</option>
    </select>

    <label for="milk" >Milk</label>
    <select id="milk">
        <option value="none">None</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>
    <br><br>

    <button class="button" onclick="makeCoffee('Espresso')">Espresso</button>
    <button class="button" onclick="makeCoffee('Cappuccino')">Cappuccino</button>
    <button class="button" onclick="makeCoffee('Latte')">Latte</button>
    <button class="button" onclick="makeCoffee('Strong Coffee')">Strong Coffee</button>
    <p id="coffee-message"></p>

    <script>
        function makeCoffee(type) {
            const sugar=document.getElementById("sugar").value;
            const milk=document.getElementById("milk").value;
            document.getElementById('coffee-message').innerText = `Brewing your ${type} with ${sugar} sugar and ${milk} milk...`;
            setTimeout(() => {
                document.getElementById('coffee-message').innerText = `${type} is ready! Enjoy ☕`;
            }, 5000);
        }


    </script>
</body>

</html>
