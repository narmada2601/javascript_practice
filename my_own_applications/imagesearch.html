<!DOCTYPE html>
<html>
    <head>
        <title>Image search</title>
<link rel="stylesheet" href="search.css">
    </head>
    <body>
      <h1>Image search Engine</h1>
      <form id="search-form">
         <input type="text" id="search-box" placeholder="search anything here">
         <button >search</button>
      </form>
      <div id="search-result"></div>
      <button id="show-more-buttons"> show more</button>
      <!-- //<script src="imagesearchscript.js"></script> -->
       <script>
        const accesskey="Sy3zqd8EHMYryKmLEHTLeGEj-mW1okUme6lIzBhbi0k";
const searchForm=document.getElementById("search-form");
const searchBox=document.getElementById("search-box");
const searchResult=document.getElementById("search-result");
const showMoreButton=document.getElementById("show-more-buttons");

let keyword= "";
let page=1;

async function searchImages()
{

 keyword = searchBox.value;
const url = `https://api.unsplash.com/search/collections?page=${page}&query=${keyword}&client_id=${accesskey}&per_page=12`;

const response = await fetch(url);
const data = await response.json();
if(page===1)
{
    searchResult.innerHTML="";
}
//console.log(data);object
const results=data.results;
results.map((result)=>{
    const image=document.createElement("img");
    image.src=result.urls.small;
    const imageLink=document.createElement("a");
    imageLink.href=result.links.html;
    imageLink.target="_blank";

    imageLink.appendChild(image);
    searchResult.appendChild(imageLink);

})
showMoreButton.style.display="block";
}

searchForm.addEventListener("submit",(e)=>
{
    e.preventDefault();
    page=1;
    searchImages();
})
showMoreButton.addEventListener("click",()=>
{
    page++;
    searchImages();


})

       </script>
     
    </body>

</html>
