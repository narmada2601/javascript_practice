//using constructor and super method......


class Vehicle {
  constructor(name, speed) {
    this.name = name;
    this.speed = speed;
  }
  move()
  {
    console.log(`${this.name} moves at ${this.speed}kms.`);
  }
}
class car extends Vehicle{
    constructor(name,speed,engineType)
    {
        super(name,speed);//parent constructor
        this.engineType=engineType;
    }
    move()
    {
        console.log(`${this.name} moves at ${this.speed}kms and engine type is ${this.engineType}`);

    }
}
class Bike extends Vehicle{
    constructor(name,speed,vehicleType)
    {
        super(name,speed);//parent constructor
        this.vehicleType=vehicleType;
    }
    move()
    {
        console.log(`${this.name} moves at ${this.speed}kms and  vehicle type is ${this.vehicleType}`);
        
    }
}
//creating instance.
let Car= new car("Mahindra XUV 700",120,"Turbo Petrol Engine");
Car.move();

let bike=new Bike("Davidson",354,"self");
bike.move();
