<html>
    <head>
        <title>typeOf operator....</title>
    </head>
    <body>
        <script>
                let num=30;
                document.write("the data type of number is:"+typeof num+"</br>");
                let string="narmada";
                document.write("the data type of string is:"+typeof string+"</br>");
                 let boolean=true;
                document.write("the data type of boolean is:"+typeof boolean+"</br>");
                
                 let date = new Date();
                 document.write("The today's date and time is: " + date + "<br/>");
                
        </script>
    </body>
</html>
